[package]
name = "thalassa"
version = "0.1.0"
description = "Thalassa: buy ambrosia with SOL"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "thalassa"

[features]
# no-idl: drop the on-chain IDL instructions (smaller .so, cheaper deploy).
# The IDL ships as JSON in the app instead.
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }

